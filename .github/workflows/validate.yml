name: Validate
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4
        with:
          repository: uofa-cs/wiki-tooling

      - name: Checkout wiki content
        uses: actions/checkout@v4
        with:
          path: wiki-content
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # [imaging] is needed by the social-card plugin.
        run: pip install -r requirements.txt "mkdocs-material[imaging]"

      # --strict fails the build on broken internal links, missing anchors,
      # and pages that aren't in nav.yml.
      - name: Build site
        run: mkdocs build --strict
